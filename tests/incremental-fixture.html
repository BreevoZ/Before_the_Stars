<!doctype html><html><head><meta charset="utf-8"><title>M1 isolated UI fixture</title></head><body>
<script type="module">
// Test-only in-memory storage and controllable clock. Never touch a player's save.
const root = new URL('../', location.href).href;
const { raw, unavailable = false, reducedMotion = false } = JSON.parse(window.name || '{}');
const { SAVE_KEY, DEBUG_SAVE_KEY } = await import('../src/save.js?fixture-bootstrap');
const key = new URLSearchParams(location.search).get('mode') === 'debug' ? DEBUG_SAVE_KEY : SAVE_KEY;
const entries = new Map(raw ? [[key, raw]] : []);
const available = () => { if (unavailable) throw new Error('Storage denied'); };
window.__storage = { getItem: key => { available(); return entries.get(key) ?? null; }, setItem: (key, value) => { available(); entries.set(key, value); }, removeItem: key => { available(); entries.delete(key); } };
if (reducedMotion) {
  const original = window.matchMedia.bind(window);
  window.matchMedia = query => query.includes('prefers-reduced-motion') ? { matches: true, media: query, addEventListener() {}, removeEventListener() {}, addListener() {}, removeListener() {} } : original(query);
}
window.__confirmMessages = [];
window.confirm = message => { window.__confirmMessages.push(message); return Boolean(window.__confirm); };
// A frame may contain several callbacks (including browser/tooling helpers).
// Replacing a single callback can silently lose the game's next frame.
let frameId=0;const callbacks=new Map();
function advanceFrame(timestamp){const pending=[...callbacks.values()];callbacks.clear();document.body.dataset.fixtureFrames=String(pending.length);for(const callback of pending)callback(timestamp);}
window.requestAnimationFrame = callback => {const id=++frameId;callbacks.set(id,callback);window.__testFrame=advanceFrame;return id;};
window.cancelAnimationFrame = id => callbacks.delete(id);
const fixture = URL.createObjectURL(new Blob([`export * from '${root}src/save.js?isolated';
import { createSaveStore as original } from '${root}src/save.js?isolated';
export function createSaveStore(unused, options) { return original(() => window.__storage, options); }`], { type: 'text/javascript' }));
const map = JSON.stringify({ imports: { [`${root}src/save.js`]: fixture } });
const html = await (await fetch('../index.html')).text();
document.open();
document.write(html.replace('<head>', `<head><base href="${root}"><script type="importmap">${map}<\/script>`));
document.close();
window.addEventListener('error', event => { document.body.dataset.fixtureError = event.error?.stack ?? event.message; });
window.addEventListener('unhandledrejection', event => { document.body.dataset.fixtureError = String(event.reason?.stack ?? event.reason); });
</script></body></html>
