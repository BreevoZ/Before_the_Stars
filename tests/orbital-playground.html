<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VI · Orbital playground</title><style>body{margin:0;background:#101719;color:#bdc9b8;font:12px system-ui}header{padding:12px 18px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}button,select{font:inherit;background:#182622;color:inherit;border:1px solid #415448;border-radius:4px;padding:8px}iframe{display:block;border:0;width:100%;height:calc(100vh - 80px)}p{margin:0;color:#92a799}a{color:inherit}</style></head><body><header><strong>VI 独立试玩</strong><select id="stage" aria-label="测试起点"><option value="0">刚刚抵达</option><option value="400">地表治理</option><option value="1100">月球开发</option><option value="1450">VI 完成</option></select><button id="reset">载入测试起点</button><select id="width" aria-label="预览宽度"><option value="100%">桌面</option><option value="390px">手机 390</option><option value="320px">手机 320</option></select><p>独立内存存档，刷新重置；正式进度不受影响。可选 1 / 5 / 10 / 20×。</p></header><script type="module">
import { colonyFixture } from './orbital-colony-cases.js';
import { mountFixture } from './progression-cases.js';
import { serializeSession } from '../src/save.js';
let frame=null, timestamp=0;
async function load(){frame?.remove();frame=await mountFixture(serializeSession(colonyFixture({seconds:Number(document.getElementById('stage').value)})),false,'debug');frame.style.width=document.getElementById('width').value;timestamp=0;}
document.getElementById('reset').onclick=load;document.getElementById('width').onchange=e=>{if(frame)frame.style.width=e.target.value;};
await load();let last=null;function tick(now){if(last!==null)timestamp+=Math.min(100,now-last);last=now;if(frame?.contentWindow?.__testFrame)frame.contentWindow.__testFrame(timestamp);requestAnimationFrame(tick);}requestAnimationFrame(tick);
</script></body></html>
