<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VI · Orbital playground</title><style>body{margin:0;background:#101719;color:#bdc9b8;font:12px system-ui}header{padding:12px 18px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}button,select{font:inherit;background:#182622;color:inherit;border:1px solid #415448;border-radius:4px;padding:8px}iframe{display:block;border:0;width:100%;height:calc(100vh - 80px)}p{margin:0;color:#92a799}a{color:inherit}</style></head><body><header><strong>VI 独立试玩</strong><select id="stage" aria-label="测试起点"><option value="fresh">原始文明萌芽</option><option value="war">战争监控</option><option value="intervene">干预与收割</option><option value="winter">核冬天</option></select><label>随机种子 <input id="seed" type="number" min="0" max="4294967295" value="1" style="width:80px"></label><button id="reset">载入测试起点</button><select id="width" aria-label="预览宽度"><option value="100%">桌面</option><option value="390px">手机 390</option><option value="320px">手机 320</option></select><p>独立内存存档，刷新重置；正式进度不受影响。可选 1 / 5 / 10 / 20×。</p></header><script type="module">
import { colonyFixture } from './orbital-colony-cases.js';
import { mountFixture } from './progression-cases.js';
import { serializeSession } from '../src/save.js';
import { updateOrbital } from '../src/orbital-game.js';
let frame=null, timestamp=0, loading=false;
async function load(){
  if(loading)return;loading=true;document.getElementById('reset').disabled=true;
  try {
  frame?.remove();frame=null;
  const stage=document.getElementById('stage').value,seed=Number(document.getElementById('seed').value)>>>0;
  const session=colonyFixture({seed,legacy:stage==='fresh'?0:20000,seconds:stage==='fresh'?0:30,talents:stage==='fresh'?[]:stage==='war'?['monitor']:['monitor','patronage','technology','regression','harvest','reseed','recovery']});
  if(stage==='winter')for(let i=0;i<54000&&session.orbital.phase!=='winter';i++)updateOrbital(session,1/30);
  frame=await mountFixture(serializeSession(session),false,'debug');frame.style.width=document.getElementById('width').value;timestamp=0;
  } finally {loading=false;document.getElementById('reset').disabled=false;}
}
document.getElementById('reset').onclick=load;document.getElementById('width').onchange=e=>{if(frame)frame.style.width=e.target.value;};
await load();let last=null;function tick(now){if(last!==null)timestamp+=Math.min(100,now-last);last=now;if(frame?.contentWindow?.__testFrame)frame.contentWindow.__testFrame(timestamp);requestAnimationFrame(tick);}requestAnimationFrame(tick);
</script></body></html>
